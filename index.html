<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Eliza</title>
    <link rel="icon" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=DM+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Lexend:wght@400;600&family=Lora:wght@400;700&family=Martian+Mono:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;600&family=Nunito+Sans:wght@400;600&family=Source+Sans+3:wght@400;600&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="elizabot.js"></script>
    <script src="espanol.js"></script>

    <style>           

        :root {
            --mono: 'Martian Mono', monospace;
            --bg: #FAFAFA;
            --text: #18181A;
            --border: #18181A;
            --hover: #E0E0E0;
        }

        * { box-sizing: border-box; }
        ::selection { background: var(--text); color: var(--bg); }

        body {
            margin: 0;
            font-family: var(--mono);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .menubar {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 4px 16px;
            display: flex;
            gap: 24px;
            font-size: 13px;
            height: 28px;
            align-items: center;
        }

        .menu { position: relative; }
        .menu-item { cursor: pointer; color: var(--text); padding: 0 4px; }

        .dropdown-content {
            display: none;
            position: absolute;
            background: var(--bg);
            border: 1px solid var(--border);
            min-width: 220px;
            max-height: 280px;
            overflow-y: auto;
            margin-top: 2px;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .dropdown-content a {
            display: block;
            padding: 6px 12px;
            color: var(--text);
            text-decoration: none;
        }

        .dropdown-content a:hover {
            background: var(--text);
            color: var(--bg);
        }

        .container {
            flex: 1;
            max-width: 760px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-family: var(--mono);
            display: flex;
            align-items: center;
            gap: .3em;
            margin: .4em 0 .8em;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .barlogo { display: flex; align-items: center; }
        .barlogo .sh { width: 22px; height: 22px; }
        .sh { width: 1em; height: 1em; overflow: visible; flex: none; }
        .mini .sh { width: 1.15em; height: 1.15em; vertical-align: -0.22em; margin-right: .3em; }

        #intro {
            position: fixed; inset: 0; z-index: 100;
            background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 2rem; cursor: pointer;
            transition: opacity .8s, visibility .8s;
        }
        #intro.out { opacity: 0; visibility: hidden; }
        .duo { display: flex; align-items: center; gap: 1rem; }
        .duo .sh {
            width: 2.6rem; height: 2.6rem;
            opacity: 0;
            animation: pop .9s cubic-bezier(.2,1.4,.4,1) forwards, idle 2.2s ease-in-out .9s infinite alternate;
        }
        .duo .sh + .sh { animation-delay: .3s, 1.2s; }
        @keyframes pop { from { opacity: 0; transform: scale(.15) rotate(-120deg); } to { opacity: 1; transform: none; } }
        @keyframes idle { from { transform: none; } to { transform: scale(1.07) rotate(10deg); } }
        #intro p {
            margin: 0; font-size: 1.5rem; letter-spacing: .06em; font-family: var(--mono);
            white-space: nowrap; padding-right: .15em; clip-path: inset(0 100% 0 0);
            animation: type 1.1s steps(14) 1s forwards;
        }
        @keyframes type { to { clip-path: inset(0 0 0 0); } }
        @media (prefers-reduced-motion: reduce) { #intro *, #intro { animation: none !important; } #intro p { clip-path: none; } .duo .sh { opacity: 1; } }

        #e_display {
            width: 100%;
            min-height: 60vh;
            height: auto;
            border: 1px solid var(--border);
            padding: 16px;
            background: var(--bg);
            color: var(--text);
            white-space: pre-wrap;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        input[type="text"] {
            width: 100%;
            font-family: var(--mono);
            border: 1px solid var(--border);
            padding: 12px 14px;
            background: var(--bg);
            color: var(--text);
        }

        input[type="text"]::placeholder {
            color: var(--text);
            opacity: 0.55;
        }

        .buttons {
            display: flex;
            gap: 22px;
            justify-content: center;
        }

        input[type="submit"],
        input[type="reset"] {
            font-family: var(--mono);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            padding: 10px 26px;
            cursor: pointer;
        }

        input[type="submit"]:hover,
        input[type="reset"]:hover {
            background: var(--hover);
        }
    </style>

    <script>
        var eliza = new ElizaBot();
        var elizaLines = [];
        var displayCols = 70;
        var displayRows = 22;
        var typingTimeout;

        let fontSizeLevel = 3;
        const fontSizes = [11, 13, 15, 17, 19, 21, 23];

        let currentTheme = 1;
        const themes = [
            { name: 'Oscuro',        text: '#ECE9E2', bg: '#151517', border: '#ECE9E2', hover: '#242427' },
            { name: 'Claro',         text: '#1A1A1C', bg: '#F6F4EF', border: '#1A1A1C', hover: '#E6E2D8' },
            { name: 'Rosa',          text: '#7A1040', bg: '#FCE4F0', border: '#7A1040', hover: '#F2CCE0' },
            { name: 'Azul',          text: '#1B3A8F', bg: '#DCEAFF', border: '#1B3A8F', hover: '#C6DBFF' },
            { name: 'Rojo',          text: '#FFD3DB', bg: '#7A0E2D', border: '#FFD3DB', hover: '#650B25' },
            { name: 'Verde',         text: '#D4F8E6', bg: '#0C2E24', border: '#D4F8E6', hover: '#08221B' },
            { name: 'Púrpura',       text: '#4E1C74', bg: '#F3E7FF', border: '#4E1C74', hover: '#E4D0FA' },
            { name: 'Índigo',        text: '#E1E7FF', bg: '#1B1848', border: '#E1E7FF', hover: '#131038' },
            { name: 'Cereza',        text: '#FFA3BC', bg: '#5A2426', border: '#FFA3BC', hover: '#481C1E' },
            { name: 'Musgo',         text: '#DCE8D6', bg: '#3F4332', border: '#DCE8D6', hover: '#4D5240' },
            { name: 'Medianoche',    text: '#E6D6A8', bg: '#141B2E', border: '#E6D6A8', hover: '#202A44' },
            { name: 'Menta rosada',  text: '#02634F', bg: '#F8D0DB', border: '#02634F', hover: '#EDBACA' },
            { name: 'Café Crema',    text: '#FAD9CE', bg: '#6F4129', border: '#FAD9CE', hover: '#5E3621' },
            { name: 'Lavanda azul',  text: '#EADFFF', bg: '#34497F', border: '#EADFFF', hover: '#3F5894' },
            { name: 'Esmeralda',     text: '#0B3B2E', bg: '#D6F7E8', border: '#0B3B2E', hover: '#BEE8D3' },
            { name: 'Zafiro',        text: '#2F4780', bg: '#E8DAFF', border: '#2F4780', hover: '#D5C2F5' },
            { name: 'Amatista',      text: '#E2D4F2', bg: '#4A2B47', border: '#E2D4F2', hover: '#3A2138' },
            { name: 'Arena',         text: '#3A2F28', bg: '#F5EDE4', border: '#3A2F28', hover: '#E8DFD4' },
            { name: 'Niebla',        text: '#2A2E35', bg: '#E8ECEF', border: '#2A2E35', hover: '#D8DEE3' }
        ];

        let currentFont = 'Martian Mono';
        const availableFonts = [
            { name: 'Martian Mono',          kind: 'monospace' },
            { name: 'IBM Plex Mono',         kind: 'monospace' },
            { name: 'JetBrains Mono',        kind: 'monospace' },
            { name: 'Montserrat',            kind: 'sans-serif' },
            { name: 'Source Sans 3',         kind: 'sans-serif' },
            { name: 'Work Sans',             kind: 'sans-serif' },
            { name: 'DM Sans',               kind: 'sans-serif' },
            { name: 'Nunito Sans',           kind: 'sans-serif' },
            { name: 'Atkinson Hyperlegible', kind: 'sans-serif' },
            { name: 'Lexend',                kind: 'sans-serif' },
            { name: 'Andika',                kind: 'sans-serif' },
            { name: 'Inter',                 kind: 'sans-serif' },
            { name: 'Lora',                  kind: 'serif' },
            { name: 'Merriweather',          kind: 'serif' }
        ];

        function applyFont() {
            document.documentElement.style.setProperty('--mono', `"${currentFont}", ${availableFonts.find(f => f.name === currentFont).kind}`);
            document.getElementById('e_display').style.fontFamily = `var(--mono)`;
            document.querySelector('input[type="text"]').style.fontFamily = `var(--mono)`;
            document.querySelectorAll('input[type="submit"], input[type="reset"]').forEach(el => {
                el.style.fontFamily = `var(--mono)`;
            });
        }

        function setFont(fontName) {
            currentFont = fontName;
            applyFont();
        }

        function applyTheme(){
            const t = themes[currentTheme];
            document.documentElement.style.setProperty('--bg', t.bg);
            document.documentElement.style.setProperty('--text', t.text);
            document.documentElement.style.setProperty('--border', t.border);
            document.documentElement.style.setProperty('--hover', t.hover);
            document.body.style.background = t.bg;
            applyFontSize();
        }

        function setTheme(i){ 
            currentTheme = i; 
            applyTheme(); 
        }

        function applyFontSize(){
            const s = fontSizes[fontSizeLevel];
            document.body.style.fontSize = s + 'px';
            
            document.querySelector('.logo').style.fontSize = (s * 0.12) + 'rem';
            
            document.getElementById('e_display').style.fontSize = s + 'px';

            document.querySelector('input[type="text"]').style.fontSize = (s * 1.05) + 'px';
            document.querySelectorAll('input[type="submit"], input[type="reset"]').forEach(b => {
                b.style.fontSize = (s * 0.95) + 'px';
            });
        }

        function fontUp(){ 
            if(fontSizeLevel < fontSizes.length-1){ 
                fontSizeLevel++; 
                applyFontSize(); 
            } 
        }
        function fontDown(){ 
            if(fontSizeLevel > 0){ 
                fontSizeLevel--; 
                applyFontSize(); 
            } 
        }

        function elizaReset(){ 
            eliza.reset(); 
            elizaLines=[]; 
            elizaStep(); 
        }

        function elizaStep(){
            const f = document.forms.e_form;
            const input = f.e_input.value.trim();

            if(input){
                elizaLines.push('<strong>TÚ:</strong> ' + esc(input));
                document.getElementById('e_display').innerHTML = 
                    elizaLines.join('<br>') + '<br>' + ELZ + 'escribiendo...';

                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    elizaLines.push(ELZ + '' + esc(eliza.transform(input)));
                    document.getElementById('e_display').innerHTML = elizaLines.join('<br>');
                }, 900 + Math.random() * 600);
            } else if(!elizaLines.length){
                elizaLines.push(ELZ + '' + esc(eliza.getInitial()));
                document.getElementById('e_display').innerHTML = elizaLines[0];
            }

            f.e_input.value = '';
            f.e_input.focus();
        }

        /* Símbolo Bouba: una flor de seis pétalos en gota que se cierra en círculo y vuelve a abrirse */
        const SH = '<svg class="sh" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor"/></svg>';
        const ELZ = '<span class="mini">' + SH + '</span><strong>ELIZA:</strong> ';
        const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const lerp = (a, b, k) => [a[0] + (b[0]-a[0])*k, a[1] + (b[1]-a[1])*k];
        const pt = p => p[0].toFixed(1) + ' ' + p[1].toFixed(1);
        const PA = [-135, -72, -20, 34, 93, 153].map(d => d*Math.PI/180);
        const PL = [40.3, 45.2, 45.7, 42.2, 41.3, 42.5];
        const CR = 38;
        const PW = [.2, .19, .21, .2, .18, .21], BEND = .5;
        function petal(i, side){
            const a = PA[i], L = PL[i], w = L*PW[i], u = [Math.cos(a), Math.sin(a)], v = [-u[1], u[0]];
            const q = (x, y) => { y += BEND*x*x; return [50 + u[0]*x*L + v[0]*y*w, 50 + u[1]*x*L + v[1]*y*w]; };
            return side ? [q(1,0), q(1,1.35), q(.42,1.55), q(0,0)] : [q(0,0), q(.42,-1.55), q(1,-1.35), q(1,0)];
        }
        function arc(s, e){
            const P0 = [50 + CR*Math.cos(s), 50 + CR*Math.sin(s)], P1 = [50 + CR*Math.cos(e), 50 + CR*Math.sin(e)];
            const h = 4/3*Math.tan((e-s)/4)*CR;
            return [P0, [P0[0] - h*Math.sin(s), P0[1] + h*Math.cos(s)], [P1[0] + h*Math.sin(e), P1[1] - h*Math.cos(e)], P1];
        }
        function shapePath(m){
            let d = '';
            for(let i = 0; i < 6; i++){
                const prev = i ? PA[i-1] : PA[5] - Math.PI*2, next = i < 5 ? PA[i+1] : PA[0] + Math.PI*2;
                const vs = (prev + PA[i])/2, ve = (PA[i] + next)/2;
                [[petal(i,0), arc(vs, PA[i])], [petal(i,1), arc(PA[i], ve)]].forEach(([f, c], j) => {
                    const g = f.map((p, k) => lerp(p, c[k], m));
                    if(!i && !j) d += 'M' + pt(g[0]);
                    d += 'C' + pt(g[1]) + ' ' + pt(g[2]) + ' ' + pt(g[3]);
                });
            }
            return d + 'Z';
        }
        const ease = x => x*x*(3-2*x);
        const bloom = x => { const c = 1.9, t = x - 1; return 1 + (c+1)*t*t*t + c*t*t; };
        function draw(p, m){ p.setAttribute('d', shapePath(m)); p.setAttribute('transform', 'rotate(' + (-m*40) + ' 50 50)'); }
        function frame(t){
            const u = (t/1000) % 8;
            const m = u < 3.5 ? 0 : u < 4.7 ? ease((u-3.5)/1.2) : u < 5.4 ? 1 : u < 6.8 ? 1 - bloom((u-5.4)/1.4) : 0;
            document.querySelectorAll('.sh:not(.st) path').forEach(p => draw(p, m));
            requestAnimationFrame(frame);
        }

        function buildMenus(){
            document.getElementById('barSh').innerHTML = SH;
            document.getElementById('iB').innerHTML = SH.replace('class="sh"','class="sh st"');
            document.getElementById('menuTema').innerHTML = themes.map((t,i) =>
                `<a href="#" onclick="setTheme(${i});return false">${t.name}</a>`).join('');
            document.getElementById('menuFuente').innerHTML = availableFonts.map(f =>
                `<a href="#" style="font-family:'${f.name}',${f.kind}" onclick="setFont('${f.name}');return false">${f.name}</a>`).join('');
            requestAnimationFrame(frame);
        }

        function runIntro(){
            const el = document.getElementById('intro');
            const end = () => { el.classList.add('out'); setTimeout(() => el.remove(), 900); };
            el.onclick = end;
            const ip = document.querySelector('#iB path'), t0 = performance.now();
            (function tick(t){
                if(!document.body.contains(el)) return;
                draw(ip, 1 - bloom(Math.min(Math.max((t - t0 - 350)/1500, 0), 1)));
                requestAnimationFrame(tick);
            })(t0);
            setTimeout(end, matchMedia('(prefers-reduced-motion: reduce)').matches ? 700 : 3300);
        }

        function toggleMenu(id){
            const m = document.getElementById(id);
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
            document.querySelectorAll('.dropdown-content').forEach(o => {
                if(o !== m) o.style.display = 'none';
            });
        }

        window.onclick = e => {
            if(!e.target.matches('.menu-item')){
                document.querySelectorAll('.dropdown-content').forEach(m => m.style.display = 'none');
            }
        };
    </script>
</head>

<body onload="buildMenus(); runIntro(); applyTheme(); applyFontSize(); applyFont(); setTimeout(elizaReset,120)">

<div class="menubar">
    <span class="barlogo" id="barSh" aria-hidden="true"></span>
    <div class="menu">
        <span class="menu-item" onclick="toggleMenu('menuArchivo')">Menú</span>
        <div id="menuArchivo" class="dropdown-content">
            <a href="index.html">Inicio</a>
            <a href="acerca-de-eliza.html">Acerca de Eliza</a>
            <a href="#" onclick="elizaReset();return false">Nueva conversación</a>
            <a href="mailto:aysermeno@outlook.com">Contacto</a>
        </div>
    </div>

    <div class="menu">
        <span class="menu-item" onclick="toggleMenu('menuTema')">Tema</span>
        <div id="menuTema" class="dropdown-content"></div>
    </div>

    <div class="menu">
        <span class="menu-item" onclick="toggleMenu('menuFuente')">Fuente</span>
        <div id="menuFuente" class="dropdown-content"></div>
    </div>

    <div class="menu">
        <span class="menu-item" onclick="fontDown()">Aa-</span>
        <span class="menu-item" onclick="fontUp()">Aa+</span>
    </div>
</div>

<div class="container">
    <h1 class="logo">ELIZA</h1>

    <form name="e_form" onsubmit="elizaStep();return false">
        <div id="e_display"></div>
        <input type="text" name="e_input" placeholder="Escribe aquí..." autocomplete="off">
        <div class="buttons">
            <input type="submit" value="Hablar">
            <input type="reset" value="Restablecer" onclick="setTimeout(elizaReset,100)">
        </div>
    </form>
</div>

<div id="intro" aria-label="Proyecto Eliza">
    <div class="duo"><span id="iB"></span><p>PROYECTO ELIZA</p></div>
</div>
</body>
</html>
